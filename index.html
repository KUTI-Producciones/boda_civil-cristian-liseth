<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Boda Cristian & Liseth</title>

<!-- Tipografías elegantes -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    background: #f7f3ef;
    color: #4a2e2e;
    text-align: center;
}

/* TÍTULOS */
h1 {
    margin-top: 30px;
    font-family: 'Great Vibes', cursive;
    font-size: 3.6rem;
}

h2 {
    font-weight: 400;
    margin-bottom: 5px;
}

.fecha {
    font-size: 1rem;
    margin-bottom: 25px;
}

/* BOTÓN ZIP */
.boton-descarga-todo {
    margin: 25px auto;
    padding: 15px 35px;
    font-size: 1.1rem;
    background-color: #b68b6a;
    color: white;
    border-radius: 30px;
    text-decoration: none;
    display: inline-block;
}

/* FOTO PRINCIPAL */
.principal {
    max-width: 900px;
    margin: 40px auto;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.principal img {
    width: 100%;
    display: block;
}

/* GALERÍA */
.galeria {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
    padding: 30px;
    max-width: 1200px;
    margin: auto;
}

.contenedor-imagen {
    position: relative;
    overflow: hidden;
    border-radius: 15px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
}

.contenedor-imagen img {
    width: 100%;
    display: block;
}

/* ICONO DE DESCARGA */
.icono-descarga {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.65);
    color: white;
    font-size: 26px;
    padding: 10px 12px;
    border-radius: 50%;
    text-decoration: none;
    transition: transform 0.2s, background 0.2s;
}

.icono-descarga:hover {
    background: rgba(182,139,106,0.9);
    transform: scale(1.1);
}
</style>
</head>

<body>

<h1>Cristian & Liseth</h1>
<h2>Boda Civil</h2>
<div class="fecha">📅 13 de enero de 2026</div>

<a class="boton-descarga-todo" href="TODAS_FOTOS_BODA.zip" download>
    Descargar todas las fotos
</a>

<!-- FOTO PRINCIPAL -->
<div class="principal">
    <img src="Kuti_PRO_1.jpg" alt="Foto principal">
    <a class="icono-descarga" href="Kuti_PRO_1.jpg" download>⬇</a>
</div>

<!-- GALERÍA RESTANTE -->
<div class="galeria" id="galeria"></div>

<script>
const galeria = document.getElementById("galeria");
const totalFotos = 24;

// Empieza desde la foto 2
for (let i = 2; i <= totalFotos; i++) {
    const contenedor = document.createElement("div");
    contenedor.className = "contenedor-imagen";

    const img = document.createElement("img");
    img.src = `Kuti_PRO_${i}.jpg`;

    const descarga = document.createElement("a");
    descarga.href = `Kuti_PRO_${i}.jpg`;
    descarga.download = `Kuti_PRO_${i}.jpg`;
    descarga.className = "icono-descarga";
    descarga.innerHTML = "⬇";

    contenedor.appendChild(img);
    contenedor.appendChild(descarga);
    galeria.appendChild(contenedor);
}
</script>

</body>
</html>
