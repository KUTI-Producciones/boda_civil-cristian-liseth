<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cristian & Liseth</title>

<!-- Google Font elegante -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    background: url('fondo_boda2.jpg') no-repeat center center fixed;
    background-size: cover;
    color: white;
    text-align: center;
}

.overlay {
    background: rgba(0,0,0,0.55);
    min-height: 100vh;
    padding: 40px 20px;
}

h1 {
    font-size: 3rem;
    margin-bottom: 40px;
    letter-spacing: 2px;
}

/* Foto principal */
.foto-principal {
    max-width: 900px;
    margin: auto;
    position: relative;
}

.foto-principal img {
    width: 100%;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.7);
}

/* Galería */
.galeria {
    margin-top: 60px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
}

.foto {
    position: relative;
}

.foto img {
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}

/* Icono descargar */
.descargar {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    padding: 8px;
    border-radius: 50%;
    color: white;
    text-decoration: none;
}

.descargar:hover {
    background: white;
    color: black;
}

/* Música */
.boton-musica {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.7);
    border: none;
    color: white;
    font-size: 22px;
    padding: 15px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 1000;
}

/* Footer */
footer {
    margin-top: 60px;
    padding: 20px;
    font-size: 1.2rem;
}

footer a {
    color: white;
    margin-left: 10px;
    font-size: 1.6rem;
}

footer a:hover {
    color: #e1306c;
}

/* Responsive */
@media(max-width:600px){
    h1 { font-size: 2.2rem; }
}
</style>
</head>

<body>

<!-- Música autoplay (permitida por navegador, inicia mute) -->
<iframe
src="https://www.youtube.com/embed/7tyNhffgmYI?autoplay=1&mute=1&loop=1&playlist=7tyNhffgmYI&controls=0"
allow="autoplay"
style="width:0;height:0;border:0;position:absolute;">
</iframe>

<button class="boton-musica" onclick="activarSonido()">🎵</button>

<div class="overlay">

<h1>Cristian Paucar & Liseth Pilamunga</h1>

<!-- Foto principal -->
<div class="foto-principal">
    <a class="descargar" href="Kuti_PRO (1).jpg" download>
        <i class="fa-solid fa-download"></i>
    </a>
    <img src="Kuti_PRO (1).jpg" alt="Foto principal">
</div>

<!-- Galería -->
<div class="galeria">
<script>
for(let i=2;i<=24;i++){
document.write(`
<div class="foto">
    <a class="descargar" href="Kuti_PRO (${i}).jpg" download>
        <i class="fa-solid fa-download"></i>
    </a>
    <img src="Kuti_PRO (${i}).jpg" alt="Foto ${i}">
</div>
`);
}
</script>
</div>

<!-- Footer -->
<footer>
KUTI PRODUCCIONES
<a href="https://www.instagram.com/kuti.producciones?igsh=MTMwNHZvODg0c29rcA==" target="_blank">
<i class="fa-brands fa-instagram"></i>
</a>
</footer>

</div>

<script>
function activarSonido(){
    const iframe=document.querySelector("iframe");
    iframe.src=iframe.src.replace("mute=1","mute=0");
}
</script>

</body>
</html>
